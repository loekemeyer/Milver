<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Milver · Carga de Pedidos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portal de carga de pedidos para comisionistas de Milver."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/jpeg" href="img/logo-milver.jpg" />
    <link rel="apple-touch-icon" href="img/logo-milver.jpg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#123c63" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Milver" />
    <link rel="stylesheet" href="css/styles.css?v=21" />
    <link rel="stylesheet" href="css/milver.css?v=21" />
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <img src="img/logo-milver.jpg" alt="Milver Bazar & Gastronomía" class="mv-logo-img" />
        <span id="mvVersion" class="mv-version"></span>
      </div>

      <div class="header-center" id="headerCenter"></div>

      <nav class="nav">
        <div class="nav-center">
          <input
            id="navSearch"
            class="nav-search"
            type="search"
            placeholder="Buscar por código o descripción…"
            name="catalog_q"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            inputmode="search"
            aria-autocomplete="none"
            data-form-type="other"
            list=""
          />

          <div class="dropdown-wrap">
            <button type="button" id="categoriesBtn" class="nav-link">
              Categorías ▾
            </button>
            <div id="categoriesMenu" class="dropdown-menu"></div>
          </div>

          <button type="button" class="nav-link" onclick="showSection('inicio')">
            Inicio
          </button>

          <button type="button" class="nav-link" onclick="showSection('productos')">
            Productos
          </button>

          <button type="button" class="nav-link" onclick="showSection('historial')">
            Historial
          </button>

          <button
            type="button"
            id="cartLink"
            class="nav-link nav-link-cart"
            onclick="showSection('carrito')"
          >
            <span class="mv-cart-ico" aria-hidden="true">🛒</span>
            <span class="cart-link-text">
              <span class="cart-link-line1">Enviá tu</span>
              <span class="cart-link-line2">Pedido (<span id="cartCount">0</span>)</span>
            </span>
          </button>
        </div>

        <div class="nav-right">
          <span id="userBadge" class="mv-user-badge" style="display:none"></span>
          <button type="button" id="logoutBtn" class="nav-link" style="display:none" onclick="logout()">
            Salir
          </button>
        </div>
      </nav>
    </header>

    <!-- LOGIN con selector de rol -->
    <div id="loginOverlay" class="mv-login-overlay">
      <div class="mv-login-card">
        <img src="img/logo-milver.jpg" alt="Milver" class="mv-logo-img-big" />
        <p class="mv-login-sub">Ingresá según tu rol</p>

        <div class="mv-role-tabs">
          <button type="button" class="mv-role-tab active" data-role="comisionista" onclick="setRole('comisionista')">Comisionista</button>
          <button type="button" class="mv-role-tab" data-role="armador" onclick="setRole('armador')">Armador de pedidos</button>
          <button type="button" class="mv-role-tab" data-role="admin" onclick="setRole('admin')">Admin</button>
        </div>

        <div id="loginNombreField">
          <label class="mv-label" for="loginNombre" id="loginNombreLabel">Comisionista</label>
          <select id="loginNombre" class="mv-select"></select>
        </div>

        <label class="mv-label" for="loginPin">PIN</label>
        <input id="loginPin" class="mv-input" type="password" placeholder="PIN" inputmode="numeric" autocomplete="current-password" />

        <div id="loginError" class="mv-login-error" style="display:none"></div>

        <button type="button" id="loginBtn" class="mv-btn mv-btn-primary" onclick="doLogin()">
          Ingresar
        </button>
      </div>
    </div>

    <main>
      <!-- INICIO (dashboard del comisionista) -->
      <section id="inicio" class="section active">
        <div class="mv-inicio">
          <h2 class="mv-inicio-hola" id="inicioHola">Hola</h2>

          <div class="mv-inicio-acciones">
            <button type="button" class="mv-accion mv-accion-primary" onclick="showSection('productos')">
              <span class="mv-accion-ico">🛒</span>
              <span class="mv-accion-txt">Cargar nuevo pedido</span>
            </button>
            <button type="button" class="mv-accion" onclick="showSection('historial')">
              <span class="mv-accion-ico">📋</span>
              <span class="mv-accion-txt">Ver pedidos anteriores</span>
            </button>
          </div>

          <div id="inicioFaltantes" class="mv-falta-alert" style="display:none"></div>

          <div class="mv-stats-grid" id="inicioStats"></div>

          <div class="mv-stats-serie" id="inicioSerie"></div>

          <div class="mv-stats-top">
            <h3>Tus mejores clientes (30 días)</h3>
            <div id="inicioTop"></div>
          </div>
        </div>
      </section>

      <!-- PRODUCTOS -->
      <section id="productos" class="section">
        <div class="mv-toolbar">
          <div id="catalogInfo" class="mv-catalog-info">Cargando catálogo…</div>
          <div class="mv-toolbar-right">
            <div class="mv-combo" id="clienteCombo">
              <input id="clienteBuscar" class="mv-input mv-combo-input" type="text"
                     placeholder="Cliente para el pedido…" autocomplete="off"
                     oninput="filtrarClientesCombo(this.value)" onfocus="abrirClientesCombo()" />
              <button type="button" id="clienteClear" class="mv-combo-clear" style="display:none" onclick="limpiarClienteCombo()">✕</button>
              <div id="clienteDropdown" class="mv-combo-drop" style="display:none"></div>
            </div>
            <button type="button" id="soloSurtidoBtn" class="mv-toggle" style="display:none" onclick="toggleSoloSurtido()"></button>
          </div>
        </div>
        <div id="catChips" class="mv-chips"></div>
        <div id="productsContainer" class="products-grid mv-grid"></div>
        <div id="loadMoreSentinel" class="mv-sentinel"></div>
      </section>

      <!-- CARRITO -->
      <section id="carrito" class="section">
        <h2 class="mv-h2">Tu pedido</h2>
        <div id="editBanner" class="mv-edit-banner" style="display:none"></div>

        <div class="mv-cart-cliente">
          <div class="mv-field">
            <label class="mv-label" for="clienteSelect">Cliente</label>
            <select id="clienteSelect" class="mv-select" onchange="setCliente(this.value)"></select>
          </div>

          <div class="mv-field">
            <label class="mv-label" for="mvPaymentSelect">Medio de pago</label>
            <select id="mvPaymentSelect" class="mv-select">
              <option value="Contado">Contado</option>
              <option value="Cuenta Corriente">Cuenta Corriente</option>
              <option value="Cheque 30 días">Cheque 30 días</option>
            </select>
          </div>

          <div class="mv-field mv-field-wide">
            <label class="mv-label" for="obsInput">Observaciones</label>
            <textarea id="obsInput" class="mv-input mv-obs" rows="2" placeholder="Opcional"></textarea>
          </div>
        </div>

        <div id="cartItems" class="mv-cart-items"></div>

        <div id="cartTotals" class="mv-cart-totals"></div>

        <button type="button" id="submitBtn" class="mv-btn mv-btn-primary mv-btn-submit" onclick="submitOrder()">
          Confirmar pedido
        </button>
      </section>

      <!-- PEDIDO CONFIRMADO -->
      <section id="pedidoConfirmado" class="section">
        <div class="mv-confirm-card">
          <div class="mv-confirm-ico">✅</div>
          <h2 class="mv-h2">¡Pedido enviado!</h2>
          <div id="confirmDetalle" class="mv-confirm-detalle"></div>
          <button type="button" class="mv-btn mv-btn-primary" onclick="nuevoPedido()">
            Cargar otro pedido
          </button>
        </div>
      </section>

      <!-- HISTORIAL -->
      <section id="historial" class="section">
        <h2 class="mv-h2">Historial de pedidos</h2>
        <div class="mv-hist-filtro">
          <input id="histBuscar" class="mv-input" type="search" placeholder="Filtrar por cliente…" oninput="renderHistorial()" />
          <select id="histCliente" class="mv-select" onchange="filtrarHistCliente(this.value)"></select>
        </div>
        <div id="historialLista" class="mv-historial"></div>
      </section>
    </main>

    <!-- Selector de cantidad: teclado numérico PROPIO (no usa el del sistema,
         así no queda tapado por el teclado de iOS) -->
    <div id="qtyModal" class="mv-qtymodal" style="display:none" onclick="if(event.target===this)cerrarQtyPicker()">
      <div class="mv-qtymodal-card">
        <div id="qtyModalTitulo" class="mv-qtymodal-titulo"></div>
        <div id="qtyModalPrecio" class="mv-qtymodal-precio"></div>
        <div id="qtyModalDisplay" class="mv-qtymodal-display">0</div>
        <div class="mv-qtymodal-quick">
          <button type="button" onclick="qtySumar(1)">+1</button>
          <button type="button" onclick="qtySumar(6)">+6</button>
          <button type="button" onclick="qtySumar(12)">+12</button>
          <button type="button" onclick="qtySumar(24)">+24</button>
        </div>
        <div class="mv-teclado">
          <button type="button" onclick="qtyTecla('1')">1</button>
          <button type="button" onclick="qtyTecla('2')">2</button>
          <button type="button" onclick="qtyTecla('3')">3</button>
          <button type="button" onclick="qtyTecla('4')">4</button>
          <button type="button" onclick="qtyTecla('5')">5</button>
          <button type="button" onclick="qtyTecla('6')">6</button>
          <button type="button" onclick="qtyTecla('7')">7</button>
          <button type="button" onclick="qtyTecla('8')">8</button>
          <button type="button" onclick="qtyTecla('9')">9</button>
          <button type="button" class="mv-tecla-c" onclick="qtyBorrarTodo()">C</button>
          <button type="button" onclick="qtyTecla('0')">0</button>
          <button type="button" class="mv-tecla-del" onclick="qtyBorrar()">⌫</button>
        </div>
        <div class="mv-qtymodal-acciones">
          <button type="button" class="mv-btn mv-qtymodal-quitar" onclick="qtyQuitar()">Quitar</button>
          <button type="button" class="mv-btn mva-btn-sec" onclick="cerrarQtyPicker()">Cancelar</button>
          <button type="button" class="mv-btn mv-btn-primary" onclick="qtyConfirmar()">Aceptar</button>
        </div>
      </div>
    </div>

    <!-- Barra fija con el pedido en curso: siempre a un toque del carrito -->
    <button type="button" id="cartBar" class="mv-cartbar" style="display:none" onclick="showSection('carrito')">
      <span class="mv-cartbar-ico">🛒</span>
      <span id="cartBarInfo" class="mv-cartbar-info"></span>
      <span class="mv-cartbar-btn">Ver pedido →</span>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="version.js?v=21"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js?v=21"></script>
  </body>
</html>
