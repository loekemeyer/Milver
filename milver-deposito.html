<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Milver · Depósito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="img/logo-milver.jpg" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="css/milver.css?v=23" />
    <link rel="stylesheet" href="css/milver-deposito.css?v=23" />
  </head>

  <body class="dep-body">
    <!-- LOGIN: el operario solo elige su nombre (sin PIN) -->
    <div id="loginOverlay" class="mv-login-overlay">
      <div class="mv-login-card">
        <img src="img/logo-milver.jpg" alt="Milver" class="mv-logo-img-big" />
        <p class="mv-login-sub">Depósito — armado de pedidos</p>
        <label class="mv-label" for="loginOperario">Tu nombre</label>
        <select id="loginOperario" class="mv-select"></select>
        <div id="loginError" class="mv-login-error" style="display:none"></div>
        <button type="button" id="loginBtn" class="mv-btn mv-btn-primary" onclick="doLogin()">Entrar</button>
      </div>
    </div>

    <header class="dep-header">
      <img src="img/logo-milver.jpg" alt="Milver" class="mv-logo-img" />
      <span class="dep-header-title">Depósito</span>
      <span id="depVersion" class="mv-version"></span>
      <span id="operarioTag" class="dep-operario"></span>
      <button type="button" class="dep-salir" onclick="logout()">Salir</button>
    </header>

    <main class="dep-main">
      <!-- COLA DE PEDIDOS -->
      <section id="pantallaCola" class="dep-pantalla active">
        <div class="dep-cola-head">
          <h2>Pedidos a armar</h2>
          <button type="button" class="dep-refresh" onclick="loadCola()">⟳ Actualizar</button>
        </div>
        <div id="colaLista" class="dep-cola"></div>
      </section>

      <!-- DETALLE + PICKING ítem por ítem -->
      <section id="pantallaPedido" class="dep-pantalla">
        <div class="dep-top-bar">
          <span class="dep-back" onclick="volverACola()">←</span>
          <span id="pedidoTitulo" class="dep-pedido-titulo"></span>
          <span id="pedidoEstado" class="dep-estado"></span>
        </div>
        <div id="pedidoInfo" class="dep-pedido-info"></div>

        <div class="dep-progreso">
          <div class="dep-progreso-barra"><div id="progBar" class="dep-progreso-fill"></div></div>
          <div id="progTxt" class="dep-progreso-txt"></div>
        </div>

        <div id="pedidoItems" class="dep-items"></div>

        <div id="marcarResultado" class="dep-resultado"></div>

        <div class="dep-acciones-fin">
          <button type="button" class="box" data-code="TA" id="btnTA" onclick="finalizar('TA')">
            <div class="box-title">✔ Pickeado listo</div>
            <div class="box-desc">cuando juntaste todo</div>
          </button>
          <button type="button" class="box" data-code="DES" id="btnDES" onclick="finalizar('DES')">
            <div class="box-title">🚚 Despachar</div>
            <div class="box-desc">sale del depósito</div>
          </button>
        </div>
      </section>
    </main>

    <!-- Modal: confirmar cantidad juntada de un ítem -->
    <div id="pickModal" class="mv-qtymodal" style="display:none" onclick="if(event.target===this)cerrarPick()">
      <div class="mv-qtymodal-card">
        <div id="pickTitulo" class="mv-qtymodal-titulo"></div>
        <div id="pickPedido" class="mv-qtymodal-precio"></div>
        <div id="pickDisplay" class="mv-qtymodal-display">0</div>
        <div class="mv-teclado">
          <button type="button" onclick="pickTecla('1')">1</button>
          <button type="button" onclick="pickTecla('2')">2</button>
          <button type="button" onclick="pickTecla('3')">3</button>
          <button type="button" onclick="pickTecla('4')">4</button>
          <button type="button" onclick="pickTecla('5')">5</button>
          <button type="button" onclick="pickTecla('6')">6</button>
          <button type="button" onclick="pickTecla('7')">7</button>
          <button type="button" onclick="pickTecla('8')">8</button>
          <button type="button" onclick="pickTecla('9')">9</button>
          <button type="button" class="mv-tecla-c" onclick="pickBorrarTodo()">C</button>
          <button type="button" onclick="pickTecla('0')">0</button>
          <button type="button" class="mv-tecla-del" onclick="pickBorrar()">⌫</button>
        </div>
        <div class="dep-pick-acciones">
          <button type="button" class="mv-btn dep-btn-falta" onclick="pickFaltante()">Sin stock / faltante</button>
          <button type="button" class="mv-btn mva-btn-sec" onclick="cerrarPick()">Cancelar</button>
          <button type="button" class="mv-btn mv-btn-primary" onclick="pickConfirmar()">Juntado ✓</button>
        </div>
      </div>
    </div>

    <script src="version.js?v=23"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="milver-deposito.js?v=23"></script>
  </body>
</html>
